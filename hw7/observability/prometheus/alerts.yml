groups:
  - name: hw7.rules
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_request_errors_total[30s]))
            /
            clamp_min(sum(rate(http_requests_total[30s])), 1)
          ) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: High HTTP error rate
          description: More than 5% of HTTP requests are failing for 30 seconds.

      - alert: ServiceDown
        expr: up{job=~"booking-service|flight-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Service target is down
          description: Prometheus cannot scrape {{ $labels.job }}.
