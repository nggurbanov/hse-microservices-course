global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ['booking-service:8080']

  - job_name: flight-service
    metrics_path: /metrics
    static_configs:
      - targets: ['flight-service:9090']

  - job_name: booking-postgres
    static_configs:
      - targets: ['booking-postgres-exporter:9187']

  - job_name: flight-postgres
    static_configs:
      - targets: ['flight-postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
